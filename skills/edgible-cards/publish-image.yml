# Publish this app's container image to GitHub's Container registry (ghcr.io), for both kinds of
# computer (Intel/AMD and ARM, such as Apple Silicon and Raspberry Pi), each time you tag a release.
#
# Copy this file to .github/workflows/publish-image.yml in the app's repository. Then:
#   git tag v1.0.0 && git push origin v1.0.0
# publishes ghcr.io/<owner>/<repo>:1.0.0 and :1.0. It needs no secrets: GitHub's own token can
# publish to the repository owner's namespace.
#
# The first time, the image is private. Make it public once: on GitHub, open the repository's
# Packages, the package, Package settings, Change visibility, Public. A public image cannot be
# made private again. An Edgible card needs it public, so anyone can pull it.
#
# The Dockerfile is expected at the repository's root; change `context` and add `file:` below if
# it lives elsewhere. From edgible-org/card-kit (skills/edgible-cards/publish-image.yml).

name: Publish image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
