experiment_id: pocket-spike
description: "Claude Code and OpenCode + gpt-oss:20b, each with and without the edgible-cards skill"
defaults:
  repeats: 1
variants:
  - variant_id: claude-skill
    agent: &claude
      type: claude-code
      model: claude-opus-5-5
      permission_mode: default
      setting_sources: []
      allowed_tools: ["Skill", "Read", "Glob", "Grep"]
      disallowed_tools: ["Bash", "Write", "Edit", "NotebookEdit", "WebFetch", "WebSearch", "Task"]
      plugins: [{type: local, path: "$CARD_KIT"}]
  - variant_id: claude-bare
    agent:
      <<: *claude
      plugins: [{type: local, path: "$EMPTY_PLUGIN"}]
  - variant_id: gptoss-skill
    agent: &oss
      type: opencode
      model: "ollama/gpt-oss:20b"
      permission_mode: default
      require_token_telemetry: false
      plugins: [{type: local, path: "$CARD_KIT"}]
  - variant_id: gptoss-bare
    agent:
      <<: *oss
      plugins: []
