experiment_id: pocket-qwen
description: "OpenCode + qwen3.5:27b, with and without the edgible-cards skill"
defaults:
  repeats: 1
variants:
  - variant_id: qwen-skill
    agent: &oss
      type: opencode
      model: "ollama/qwen3.5:27b"
      permission_mode: default
      require_token_telemetry: false
      plugins: [{type: local, path: "$CARD_KIT"}]
  - variant_id: qwen-bare
    agent:
      <<: *oss
      plugins: []
