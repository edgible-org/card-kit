# category: AI tools for assistants (MCP servers) (fit: good)
- id: ai-tools-for-assistants-mcp-servers
  prompt: "I want to let Claude or ChatGPT use my files or database. I've been using hosted MCP platforms and I'm looking for something I can run myself. What would you recommend?"
  expect:
    - offers card(s) for this need before apps with no card: mcp-signin, mcp-bridge, edgible-mcp
    - gives each offered card its cards.edgible.org page address
    - treats fit as good (an MCP server is a small web service next to the data it reaches, which is what Edgible publishes; what decides it is how the person's assistant signs in)
    - states who reaches it and which auth mode fits (from the needs map: for Claude's web, desktop and phone apps (custom connectors, which need OAuth): the server unpublished, behind the mcp-signin card, which signs people in with Edgible (mcp-signin on none, mcp-signin-login on org); for clients that send a header (Claude Code and most developer tools: Authorization: Bearer): api-key, one key per person)
    - asks a decision question along the lines of: which assistant will connect to it: Claude Code, the Claude app (desktop, web, phone), or something else?
    - asks a decision question along the lines of: should it only read, or also change things?
    - does not deploy or build anything before the person chooses
  must_not:
    - build, deploy, or change anything before the person chooses
    - claim to have already set the app up

