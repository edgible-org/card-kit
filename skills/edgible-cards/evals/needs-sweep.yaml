# Needs-sweep prompts: one per needs-map category. Used to learn and improve the skill.
# Not held-out: you may tune against findings from these. Regenerated by make-needs-sweep.py --write-set.
# Shape matches run-evals.py (id, prompt, expect, must_not).

# category: Bookmarks and Link Sharing (fit: good)
- id: bookmarks-and-link-sharing
  prompt: "I want to save articles to read later. I've been using Pocket and I'm looking for something I can run myself. What would you recommend?"
  expect:
    - offers card(s) for this need before apps with no card: linkding, linkwarden
    - gives each offered card its cards.edgible.org page address
    - treats fit as good (small, and works well behind a login)
    - states who reaches it and which auth mode fits (from the needs map: web interface on org; browser extensions and phone apps cannot pass an Edgible sign-in, so their hostname is none with the app's own login, or api-key if the app's clients can send a header)
    - asks a decision question along the lines of: read later with saved page copies, or just links?
    - asks a decision question along the lines of: do you save from a phone?
    - does not deploy or build anything before the person chooses
  must_not:
    - build, deploy, or change anything before the person chooses
    - claim to have already set the app up

