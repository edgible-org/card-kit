name: kit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cards:
    # A change to the kit must still pass every card in edgible-org/cards.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: card-kit
      - uses: actions/checkout@v4
        with:
          repository: edgible-org/cards
          path: cards
      - name: check-cards on edgible-org/cards
        run: |
          cd cards
          # Cards sit at the top level; before that move they were under cards/.
          if [ -d cards ] && ! ls */card.yml >/dev/null 2>&1; then cd cards; fi
          ../card-kit/run check-cards 2>&1 || ../../card-kit/run check-cards

  needs-map:
    # The skill's needs map must still match awesome-selfhosted's categories and the
    # starters and cards that exist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./run check-map

  skill-frontmatter:
    # SKILL.md's front matter must be valid YAML for a strict parser (GitHub Copilot CLI
    # refuses the whole skill otherwise; VS Code, Codex and Cursor forgive it), with a
    # description under 1024 characters. An unquoted ": " in the description breaks it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          text = open("skills/edgible-cards/SKILL.md", encoding="utf-8").read()
          front = text.split("---")[1]
          meta = yaml.safe_load(front)
          assert meta["name"] == "edgible-cards", meta.get("name")
          assert 0 < len(meta["description"]) < 1024, len(meta["description"])
          print("front matter ok:", len(meta["description"]), "characters")
          PY
