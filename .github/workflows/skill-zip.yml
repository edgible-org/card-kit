# The edgible-cards skill as a zip, for Claude's apps (Chat in Claude Desktop, claude.ai, the
# phone), which take a skill as an upload under Customize > Skills and cannot update it themselves.
# On every change to the skill on main, the zip is rebuilt and replaces the asset of the "skill"
# release, so one address always serves the current skill:
#   https://github.com/edgible-org/card-kit/releases/download/skill/edgible-cards.zip
# The zip holds the edgible-cards folder at its top level, as the upload expects.

name: skill-zip

on:
  push:
    branches: [main]
    paths:
      - skills/edgible-cards/**
      - .github/workflows/skill-zip.yml
  workflow_dispatch:

permissions:
  contents: write   # move the skill tag and replace the release's asset

concurrency:
  group: skill-zip
  cancel-in-progress: true

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the zip
        run: |
          cd skills
          zip -qr -X ../edgible-cards.zip edgible-cards -x '*.DS_Store'
          cd ..
          unzip -l edgible-cards.zip | grep -q ' edgible-cards/SKILL.md$'
          ls -l edgible-cards.zip

      - name: Publish it as the skill release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(git rev-parse --short HEAD)
          when=$(date -u +%Y-%m-%d)
          notes="The edgible-cards skill as of $short ($when), for Claude's apps: in Customize > Skills, remove the old edgible-cards, then + > Create skill > Upload a skill, and choose edgible-cards.zip. Start a new chat after. Agents with a shell (Claude Code, Codex, Cursor, OpenCode) install it with git instead, and update it by asking: see the README."
          git tag -f skill HEAD
          git push -f origin refs/tags/skill
          if gh release view skill > /dev/null 2>&1; then
            gh release edit skill --title "edgible-cards skill ($short, $when)" --notes "$notes" --latest=false
          else
            gh release create skill --title "edgible-cards skill ($short, $when)" --notes "$notes" --latest=false
          fi
          gh release upload skill edgible-cards.zip --clobber
