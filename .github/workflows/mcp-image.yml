# Build the MCP images, for amd64 and arm64, whenever their directory changes: edgible-mcp/ and
# mcp-signin/. On main each is published as ghcr.io/edgible-org/<name>:<version in package.json>,
# which the card of that name in edgible-org/cards runs. A published version is never
# overwritten: a change to an image needs a new version in package.json and in server.mjs.

name: mcp-image

on:
  pull_request:
    paths:
      - edgible-mcp/**
      - mcp-signin/**
      - .github/workflows/mcp-image.yml
  push:
    branches: [main]
    paths:
      - edgible-mcp/**
      - mcp-signin/**
      - .github/workflows/mcp-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [edgible-mcp, mcp-signin]
    env:
      IMAGE: ghcr.io/edgible-org/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          version=$(jq -r .version ${{ matrix.name }}/package.json)
          grep -qiE "version ?[:=] '$version'" ${{ matrix.name }}/server.mjs \
            || { echo "::error::server.mjs does not say version $version, as package.json does"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: A changed image needs a new version
        if: github.event_name == 'pull_request' && steps.v.outputs.published == 'true'
        run: echo "::warning::$IMAGE:${{ steps.v.outputs.version }} is already published. Raise the version in package.json and server.mjs, or main will not publish this change."

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && steps.v.outputs.published == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.name }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && steps.v.outputs.published == 'false' }}
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
