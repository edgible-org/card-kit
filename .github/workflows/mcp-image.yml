# Build the MCP images, for amd64 and arm64, whenever their directory changes: edgible-mcp/ and
# mcp-signin/. On main each is published as ghcr.io/edgible-org/<name>:<version in package.json>,
# which the card of that name in edgible-org/cards runs. A published version is never
# overwritten: a change to an image needs a new version in package.json and in server.mjs.

name: mcp-image

on:
  pull_request:
    paths:
      - edgible-mcp/**
      - mcp-signin/**
      - .github/workflows/mcp-image.yml
  push:
    branches: [main]
    paths:
      - edgible-mcp/**
      - mcp-signin/**
      - .github/workflows/mcp-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write       # sign each published image's build attestation (Sigstore)
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [edgible-mcp, mcp-signin]
    env:
      IMAGE: ghcr.io/edgible-org/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        id: v
        run: |
          version=$(jq -r .version ${{ matrix.name }}/package.json)
          grep -qiE "version ?[:=] '$version'" ${{ matrix.name }}/server.mjs \
            || { echo "::error::server.mjs does not say version $version, as package.json does"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # A change to what goes in the image, with a version that is already published, would never
      # be published: card-kit #29 changed edgible-mcp's code, kept 0.8.23, and main pushed nothing.
      # It fails the pull request (and main, so it is seen there too). Its README and tests don't count.
      - name: A changed image needs a new version
        if: github.event_name != 'workflow_dispatch' && steps.v.outputs.published == 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD -- '${{ matrix.name }}/' \
            ':(exclude)${{ matrix.name }}/README.md' ':(exclude)${{ matrix.name }}/*.test.mjs')
          [ -z "$changed" ] && { echo "no change to the image"; exit 0; }
          echo "::error::$IMAGE:${{ steps.v.outputs.version }} is already published, and this changes the image (${changed//$'\n'/ }). Raise the version in package.json, package-lock.json and server.mjs, or main will not publish it."
          exit 1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' && steps.v.outputs.published == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image must start: 0.7.14 was published without gateway-provider.mjs, which the Dockerfile
      # listed by name, and crashed on start. Build one platform, run it, and ask its health endpoint.
      - name: The image starts
        if: matrix.name == 'edgible-mcp'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.name }}
          platforms: linux/amd64
          load: true
          tags: smoke:test
      - name: The image answers its health check
        if: matrix.name == 'edgible-mcp'
        run: |
          docker run -d --name smoke smoke:test
          for _ in $(seq 30); do
            if docker exec smoke wget -qO- http://127.0.0.1:8000/healthz 2>/dev/null | grep -q ok; then echo "healthy"; exit 0; fi
            [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || break
            sleep 2
          done
          echo "::error::the image does not answer /healthz"; docker logs smoke | tail -20; exit 1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: ${{ matrix.name }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && steps.v.outputs.published == 'false' }}
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}

      # GitHub signs a statement that this image was built here, from this commit; it is stored
      # beside the image. Check with: gh attestation verify oci://<image>:<version> --repo edgible-org/card-kit
      - name: Sign the image
        if: github.event_name != 'pull_request' && steps.v.outputs.published == 'false'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
