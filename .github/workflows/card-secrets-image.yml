# Build the card-secrets image, for amd64 and arm64, whenever card-secrets/ changes. On main it is
# published as ghcr.io/edgible-org/card-secrets:<VERSION>, which cards run as their <card>-secrets
# service. A published version is never overwritten: a change needs a new VERSION.

name: card-secrets-image

on:
  pull_request:
    paths: [card-secrets/**, .github/workflows/card-secrets-image.yml]
  push:
    branches: [main]
    paths: [card-secrets/**, .github/workflows/card-secrets-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/edgible-org/card-secrets

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          version=$(cat card-secrets/VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: A changed image needs a new version
        if: github.event_name == 'pull_request' && steps.v.outputs.published == 'true'
        run: echo "::warning::$IMAGE:${{ steps.v.outputs.version }} is already published. Raise card-secrets/VERSION, or main will not publish this change."
      - name: Test it makes, keeps and loads secrets
        run: |
          docker build -q -t card-secrets:test card-secrets
          docker volume create cs >/dev/null
          run() { docker run --rm -v cs:/run/card-secrets -e CARD_SECRETS="$1" card-secrets:test "${@:2}"; }
          run $'A=echo one\nB=openssl rand -hex 8' generate
          run $'A=echo two' generate
          [ "$(run '' show A)" = one ] || { echo "an existing secret changed"; exit 1; }
          [ -n "$(run '' show B)" ] || { echo "B was not made"; exit 1; }
          docker run --rm -v cs:/run/card-secrets:ro --entrypoint sh alpine:3.20 /run/card-secrets/.load sh -c '[ "$A" = one ]' \
            || { echo "the loader did not load A"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && steps.v.outputs.published == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: card-secrets
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' && steps.v.outputs.published == 'false' }}
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
