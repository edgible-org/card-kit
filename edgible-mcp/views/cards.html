<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: #d9dce6; --card: #f4f6fb; --band: #2e4a9e; --band-fg: #ffffff;
    --ok: #1f9d55; --bad: #d64545; --warn: #c27c0e; --idle: #8e8e93; --chip: #e7eaf3; --link: #0a66c2; --art: #ffffff;
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1e; --fg: #f2f2f7; --muted: #a1a1a6; --line: #3a3a3c; --card: #26272b; --band: #3b5bc0; --band-fg: #ffffff;
    --ok: #34c37a; --bad: #ff6b6b; --warn: #f0b13c; --idle: #8e8e93; --chip: #34353a; --link: #64a8ff; --art: #2f3036;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1c1e; --fg: #f2f2f7; --muted: #a1a1a6; --line: #3a3a3c; --card: #26272b; --band: #3b5bc0; --band-fg: #ffffff;
      --ok: #34c37a; --bad: #ff6b6b; --warn: #f0b13c; --idle: #8e8e93; --chip: #34353a; --link: #64a8ff; --art: #2f3036;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 14px 16px 16px; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; }
  .needs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 2px; }
  .need { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 12px; }
  .tc { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; cursor: pointer; }
  .tc:hover { border-color: var(--band); }
  .tc:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .band { background: var(--band); color: var(--band-fg); padding: 7px 12px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .band .name { font-weight: 700; letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .band .kind { font-size: 11px; opacity: .85; white-space: nowrap; }
  .art { background: var(--art); margin: 10px 12px 0; border-radius: 8px; border: 1px solid var(--line); height: 92px; display: flex; align-items: center; justify-content: center; }
  .art img { max-width: 64px; max-height: 64px; }
  .art .ph { width: 56px; height: 56px; border-radius: 12px; background: var(--chip); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px; color: var(--muted); }
  .banner { margin: 8px 12px 0; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--idle); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
  .desc { margin: 6px 12px 0; font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tags { margin: 8px 12px 0; display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { background: var(--chip); border-radius: 6px; padding: 1px 6px; font-size: 11px; }
  .tag.warn { color: var(--warn); }
  .foot { margin-top: auto; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; }
  .foot .mach { color: var(--muted); }
  .foot a { color: var(--link); text-decoration: none; white-space: nowrap; }
  .foot a:hover { text-decoration: underline; }
  .empty, .wait { color: var(--muted); padding: 8px 0; }
  .more { margin-top: 12px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div id="root"><p class="wait">Looking at the cards…</p></div>
<script>
(function () {
  var nextId = 1, pending = {};
  var root = document.getElementById('root');

  function send(msg) { window.parent.postMessage(msg, '*'); }
  function request(method, params) {
    var id = nextId++;
    send({ jsonrpc: '2.0', id: id, method: method, params: params || {} });
    return new Promise(function (ok, fail) { pending[id] = { ok: ok, fail: fail }; });
  }
  function notify(method, params) { send({ jsonrpc: '2.0', method: method, params: params || {} }); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function theme(ctx) { if (ctx && ctx.theme) document.documentElement.setAttribute('data-theme', ctx.theme); }
  function resize() {
    var r = document.documentElement.getBoundingClientRect();
    notify('ui/notifications/size-changed', { width: Math.ceil(r.width), height: Math.ceil(document.body.scrollHeight) });
  }
  function open(url) { request('ui/open-link', { url: url }).catch(function () { window.open(url, '_blank', 'noopener'); }); }

  var DOOR = { none: 'Open door', org: 'Members only', 'api-key': 'Key holders', tcp: 'TCP' };
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function when(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || '');
    return m ? (+m[3]) + ' ' + MONTHS[+m[2] - 1] + ' ' + m[1] : (d || '');
  }
  function tested(c) {
    if (!c.tested) return { dot: '', text: 'not tested yet' };
    var pass = c.tested.result === 'pass';
    return { dot: pass ? 'ok' : 'bad', text: (pass ? 'passed ' : 'failed ') + when(c.tested.date) };
  }

  function card(c) {
    var t = el('div', 'tc');
    t.tabIndex = 0;
    t.setAttribute('role', 'link');
    t.setAttribute('aria-label', 'Open the ' + c.name + ' card page');
    var go = function () { open(c.page); };
    t.addEventListener('click', go);
    t.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });

    var band = el('div', 'band');
    band.appendChild(el('span', 'name', c.name.toUpperCase()));
    band.appendChild(el('span', 'kind', c.type === 'pattern' ? 'Pattern card' : 'App card'));
    t.appendChild(band);

    var art = el('div', 'art');
    if (c.icon) {
      var img = el('img'); img.src = c.icon; img.alt = '';
      img.addEventListener('error', function () { art.textContent = ''; art.appendChild(el('span', 'ph', c.name.charAt(0).toUpperCase())); });
      img.addEventListener('load', resize);
      art.appendChild(img);
    } else {
      art.appendChild(el('span', 'ph', c.name.charAt(0).toUpperCase()));
    }
    t.appendChild(art);

    var st = tested(c);
    var b = el('div', 'banner');
    b.appendChild(el('span', 'dot ' + st.dot));
    b.appendChild(el('span', null, [c.needs && c.needs[0], st.text].filter(Boolean).join(' · ')));
    t.appendChild(b);

    if (c.description) t.appendChild(el('div', 'desc', c.description));

    var tags = el('div', 'tags');
    var doors = [];
    (c.apps || []).forEach(function (a) { (a.auth || []).forEach(function (m) { if (doors.indexOf(m) < 0) doors.push(m); }); });
    doors.forEach(function (m) { tags.appendChild(el('span', 'tag', DOOR[m] || m)); });
    if (c.scan && c.scan.fixable) tags.appendChild(el('span', 'tag warn', c.scan.fixable + ' fixable in image scan'));
    if (tags.childNodes.length) t.appendChild(tags);

    var foot = el('div', 'foot');
    var mach = [];
    if (c.machine && c.machine.memory) mach.push(c.machine.memory);
    if (c.machine && c.machine.runs && c.machine.runs.length) {
      mach.push(c.machine.runs.map(function (r) { return r === 'amd64' ? 'Intel' : r === 'arm64' ? 'ARM' : r; }).join(' · '));
    }
    foot.appendChild(el('span', 'mach', mach.join(' · ')));
    var a = el('a', null, 'Card page →'); a.href = c.page; a.target = '_blank'; a.rel = 'noopener';
    a.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); go(); });
    foot.appendChild(a);
    t.appendChild(foot);
    return t;
  }

  function render(v) {
    root.textContent = '';
    if (!v || !v.cards) { root.appendChild(el('p', 'empty', 'See the text answer.')); resize(); return; }
    if (v.kind === 'find') {
      root.appendChild(el('h1', null, v.cards.length ? 'Cards for “' + v.query + '”' : 'No card yet for “' + v.query + '”'));
      root.appendChild(el('div', 'sub', 'Each is a tested recipe for one app (or several wired together). Tap one to open its page.'));
      if (v.needs && v.needs.length) {
        var n = el('div', 'needs');
        v.needs.forEach(function (x) { n.appendChild(el('span', 'need', x.category + (x.fit ? ' · fit ' + x.fit : ''))); });
        root.appendChild(n);
      }
    }
    var grid = el('div', 'grid');
    v.cards.forEach(function (c) { grid.appendChild(card(c)); });
    root.appendChild(grid);
    if (v.kind === 'find' && !v.cards.length) root.appendChild(el('p', 'more', 'An app without a card can still be set up: your AI writes and tests a card for it first.'));
    resize();
  }

  window.addEventListener('message', function (ev) {
    var m = ev.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (m.id != null && pending[m.id] && !m.method) {
      var p = pending[m.id]; delete pending[m.id];
      if (m.error) p.fail(m.error); else p.ok(m.result);
      return;
    }
    if (m.method === 'ui/notifications/tool-result') {
      var r = m.params || {};
      render(r.structuredContent || null);
    } else if (m.method === 'ui/notifications/host-context-changed') {
      theme(m.params);
    }
  });

  request('ui/initialize', {
    protocolVersion: '2026-01-26',
    appInfo: { name: 'edgible-cards', version: '1' },
    appCapabilities: {},
  }).then(function (res) {
    theme(res && res.hostContext);
    notify('ui/notifications/initialized');
    resize();
  });
})();
</script>
</body>
</html>
